<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · Monetine</title>
<style>
  :root { --bg: #F2F3F5; --surface: #FFFFFF; --text: #0B0C0E; --secondary: #686E78; --accent: #0EA567; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0B0C0E; --surface: #17191D; --text: #F5F6F7; --secondary: #9CA2AC; --accent: #3DDC97; }
  }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  article { background: var(--surface); border-radius: 24px; padding: 8px 24px 24px; }
  h1 { font-size: 30px; line-height: 1.2; }
  h2 { font-size: 20px; margin-top: 32px; }
  a { color: var(--accent); }
  nav { color: var(--secondary); font-size: 14px; margin-bottom: 16px; }
  code { font-size: 14px; }
</style>
</head>
<body>
<main>
<nav>Monetine · <a href="{{ '/privacy' | relative_url }}">Privacy</a> · <a href="{{ '/terms' | relative_url }}">Terms</a>
 · <a href="{{ '/it/privacy' | relative_url }}">Privacy (IT)</a> · <a href="{{ '/it/terms' | relative_url }}">Termini (IT)</a></nav>
<article>
{{ content }}
</article>
</main>
</body>
</html>
